name: Build Client Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ../../../packages/common
          uv pip install --system -e ../../../packages/protocol
          uv pip install --system -e ../../../packages/simconnect
          uv pip install --system -e ../../..
          uv pip install --system pyinstaller

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm build_exe.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenATC-Client-Windows
          path: apps/client/dist/OpenATC_Client/
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ../../../packages/common
          uv pip install --system -e ../../../packages/protocol
          uv pip install --system -e ../../../packages/simconnect
          uv pip install --system -e ../../..
          uv pip install --system pyinstaller

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm build_exe.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenATC-Client-macOS
          path: apps/client/dist/OpenATC_Client/
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenATC-Client-Windows/OpenATC_Client.exe
            OpenATC-Client-macOS/OpenATC_Client
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
