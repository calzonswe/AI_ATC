[project]
name = "openatc"
version = "0.1.0"
description = "Offline local-first AI Air Traffic Control system for MSFS"
requires-python = ">=3.12"
authors = [
    { name = "OpenATC Contributors" },
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5.0",
    "pyright>=1.1.370",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "services/*",
    "packages/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "*.sh",
    "*.ps1",
    "*.spec",
    "*.yml",
    "*.yaml",
    "*.md",
    "Makefile",
    "docker/ollama-init.sh",
    "scripts/build_exe.sh",
    "scripts/build_exe.ps1",
    "apps/client/build_exe.spec",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "E402"]
"*/tests/*.py" = ["S101", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["apps", "services", "packages"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "services", "packages", "tests"]
